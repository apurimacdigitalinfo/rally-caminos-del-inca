name: Actualizador de Tiempos Rally

on:
  schedule:
    # Se ejecuta automáticamente cada 5 minutos
    - cron: '*/5 * * * *'
  # Permite ejecutarlo manualmente desde el panel de GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Ejecutar script extractor
        run: python extractor_rally.py

      - name: Guardar y hacer Push del JSON actualizado
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add clasificacion_caminos_del_inca.json
          git commit -m "Auto-update tiempos rally [skip ci]" || exit 0
          git push
